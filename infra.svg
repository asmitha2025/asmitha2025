<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Animated 3D architecture: React, Spring Boot or FastAPI, Kafka, PostgreSQL, AWS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#243044" stroke-width="0.6" opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="330" rx="16" fill="url(#bg)"/>
  <rect width="900" height="330" rx="16" fill="url(#grid)"/>

  <!-- Twinkling dots -->
  <g fill="#7dd3fc">
    <circle cx="60" cy="50" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="45" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="55" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">How my systems flow</text>

  <!-- Connection lines (flowing dashes) -->
  <g stroke="#475569" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <path id="p1" d="M142 150 L228 150"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
    <path id="p2" d="M312 150 L398 150"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
    <path id="p3" d="M482 150 L568 150"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
    <path id="p4" d="M652 150 L738 150"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- Data packets -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle r="4"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.45s"><mpath xlink:href="#p2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.9s"><mpath xlink:href="#p3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.8s" repeatCount="indefinite" begin="1.35s"><mpath xlink:href="#p4"/></animateMotion></circle>
  </g>

  <!-- Shadows -->
  <g fill="#000" opacity="0.35">
    <ellipse cx="100" cy="214" rx="44" ry="9"/>
    <ellipse cx="270" cy="214" rx="44" ry="9"/>
    <ellipse cx="440" cy="214" rx="44" ry="9"/>
    <ellipse cx="610" cy="214" rx="44" ry="9"/>
    <ellipse cx="780" cy="214" rx="44" ry="9"/>
  </g>

  <!-- Node 1: React UI -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="0s" repeatCount="indefinite"/>
    <polygon points="58,130 100,154 100,194 58,170" fill="#0284c7"/>
    <polygon points="142,130 100,154 100,194 142,170" fill="#0ea5e9"/>
    <polygon points="100,106 142,130 100,154 58,130" fill="#7dd3fc"/>
  </g>

  <!-- Node 2: Backend API -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    <polygon points="228,130 270,154 270,194 228,170" fill="#15803d"/>
    <polygon points="312,130 270,154 270,194 312,170" fill="#22c55e"/>
    <polygon points="270,106 312,130 270,154 228,130" fill="#86efac"/>
  </g>

  <!-- Node 3: Kafka -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    <polygon points="398,130 440,154 440,194 398,170" fill="#c2410c"/>
    <polygon points="482,130 440,154 440,194 482,170" fill="#f97316"/>
    <polygon points="440,106 482,130 440,154 398,130" fill="#fdba74"/>
  </g>

  <!-- Node 4: PostgreSQL -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="1.8s" repeatCount="indefinite"/>
    <polygon points="568,130 610,154 610,194 568,170" fill="#1d4ed8"/>
    <polygon points="652,130 610,154 610,194 652,170" fill="#3b82f6"/>
    <polygon points="610,106 652,130 610,154 568,130" fill="#93c5fd"/>
  </g>

  <!-- Node 5: AWS + Docker -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" begin="2.4s" repeatCount="indefinite"/>
    <polygon points="738,130 780,154 780,194 738,170" fill="#b45309"/>
    <polygon points="822,130 780,154 780,194 822,170" fill="#f59e0b"/>
    <polygon points="780,106 822,130 780,154 738,130" fill="#fde68a"/>
  </g>

  <!-- Labels -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g fill="#e6edf3" font-size="14" font-weight="600">
      <text x="100" y="248">React UI</text>
      <text x="270" y="248">Spring Boot / FastAPI</text>
      <text x="440" y="248">Kafka</text>
      <text x="610" y="248">PostgreSQL</text>
      <text x="780" y="248">AWS + Docker</text>
    </g>
    <g fill="#8b949e" font-size="12">
      <text x="100" y="266">Frontend</text>
      <text x="270" y="266">Backend APIs</text>
      <text x="440" y="266">Event streaming</text>
      <text x="610" y="266">Database</text>
      <text x="780" y="266">Cloud + CI/CD</text>
    </g>
    <text x="450" y="306" fill="#58a6ff" font-size="13">Java · Python · SQL · GitHub Actions · DSA</text>
  </g>
</svg>
